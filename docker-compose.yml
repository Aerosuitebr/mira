services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: prospect-portal-postgres
    environment:
      POSTGRES_DB: prospect_portal
      POSTGRES_USER: prospect
      POSTGRES_PASSWORD: prospect
    ports:
      - "5433:5432"
    volumes:
      # Persistência no host — sobrevive a recriação de imagem/container
      - ${PROSPECT_DATA_ROOT:-C:/prospect-portal-data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospect -d prospect_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: prospect-portal-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: prospect-portal-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports:
      - "9201:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  redis_data:
  es_data:
