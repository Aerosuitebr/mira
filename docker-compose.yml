services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mira
      POSTGRES_PASSWORD: mira
      POSTGRES_DB: mira
    ports:
      - "5433:5432"
    volumes:
      - mira_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mira -d mira"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.13
    environment:
      MEILI_MASTER_KEY: mira-dev-master-key-change-me
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - mira_meili:/meili_data

volumes:
  mira_pg:
  mira_meili:
