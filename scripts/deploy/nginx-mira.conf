server {
  listen 80;
  server_name _;

  client_max_body_size 20m;

  # Re-resolve nomes Docker (evita 502 apos recreate). Sem path no proxy_pass
  # para preservar a URI original (JS/CSS nao podem cair no index.html).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Webhook da Evolution termina no robô assíncrono, não no frontend.
  location = /webhooks/outreach-bot {
    set $mira_outreach_bot http://mira-outreach-bot:8090;
    proxy_pass $mira_outreach_bot/webhooks/evolution;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location /api/ {
    set $mira_api_upstream http://mira-api:8082;
    proxy_pass $mira_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location / {
    set $mira_front_upstream http://mira-frontend:80;
    proxy_pass $mira_front_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
  }
}
