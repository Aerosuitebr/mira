name: Validate and Deploy Production

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: production-pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Backend compile + Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Block secret-like files in diff
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            RANGE='HEAD^..HEAD'
          else
            RANGE='HEAD'
          fi
          mapfile -t files < <(git diff --name-only $RANGE || true)
          blocked=0
          for f in "${files[@]}"; do
            base=$(basename "$f")
            case "$base" in
              .env|.env.*|*.pem|*.p12|credentials.json|id_rsa|id_ed25519)
                if [[ "$base" != *.example && "$base" != *.sample ]]; then
                  echo "Bloqueado: $f"
                  blocked=1
                fi
                ;;
            esac
            if [[ "$f" =~ (^|/)\.env($|\.) ]] && [[ "$base" != *.example && "$base" != *.sample ]]; then
              echo "Bloqueado: $f"
              blocked=1
            fi
          done
          if [[ "$blocked" -eq 1 ]]; then
            echo "CI bloqueou possiveis segredos no diff."
            exit 1
          fi
          echo "Varredura de segredos OK"

      - name: Block em-dash / en-dash in changed copy
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            mapfile -t files < <(git diff --name-only HEAD^..HEAD -- 'frontend/src' 'backend/src' || true)
          else
            mapfile -t files < <(git ls-files 'frontend/src' 'backend/src' || true)
          fi
          blocked=0
          for f in "${files[@]}"; do
            [[ -f "$f" ]] || continue
            case "$f" in
              *.ts|*.html|*.scss|*.java|*.yml|*.yaml|*.md) ;;
              *) continue ;;
            esac
            case "$f" in
              */db/migration/*) continue ;;
            esac
            if grep -n $'[\u2013\u2014]' "$f" >/dev/null 2>&1; then
              echo "Travessao em: $f"
              grep -n $'[\u2013\u2014]' "$f" || true
              blocked=1
            fi
          done
          if [[ "$blocked" -eq 1 ]]; then
            echo "Remova travessoes (—/–) do copy alterado."
            exit 1
          fi
          echo "Copy sem travessao OK"

      - name: Compile backend
        working-directory: backend
        run: mvn -s .mvn/settings.xml -B -DskipTests compile

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend (production)
        working-directory: frontend
        run: npm run build -- --configuration=production

      - name: Install outreach bot deps
        working-directory: services/outreach-bot
        run: npm ci

      - name: Test outreach bot
        working-directory: services/outreach-bot
        run: npm test

  deploy:
    name: Deploy Vultr and smoke production
    needs: quality
    if: github.event_name != 'pull_request' && needs.quality.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4

      - name: Resolve release SHA
        id: meta
        shell: bash
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "Validated release ${GITHUB_SHA}"

      - name: Setup SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "${SSH_KEY:-}" && test -n "${SSH_HOST:-}" && test -n "${SSH_USER:-}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          cat > ~/.ssh/config <<EOF
          Host mira-prod
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ~/.ssh/prod_key
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
          EOF
          ssh mira-prod 'echo SSH_OK && hostname'

      - name: Pack validated release
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz -o /tmp/mira-release.tgz HEAD -- \
            backend/src/main/java backend/src/main/resources \
            frontend/src frontend/angular.json frontend/nginx.conf frontend/package.json frontend/package-lock.json \
            services/outreach-bot docker-compose.production.yml docker-compose.tunnel.yml docker-compose.yml \
            .env.production.example scripts/deploy/nginx-mira.conf scripts/deploy/prod-remote.sh \
            scripts/deploy/mira-poll-deploy.sh scripts/deploy/install-mira-poller.sh
          ls -lh /tmp/mira-release.tgz

      - name: Upload release
        shell: bash
        run: |
          set -euo pipefail
          scp /tmp/mira-release.tgz mira-prod:/tmp/mira-release.tgz
          printf '%s\n' '${{ steps.meta.outputs.sha }}' > /tmp/mira-release.sha
          scp /tmp/mira-release.sha mira-prod:/tmp/mira-release.sha

      - name: Rebuild and restart production
        shell: bash
        run: |
          set -euo pipefail
          scp scripts/deploy/prod-remote.sh mira-prod:/tmp/mira-prod-remote.sh
          ssh mira-prod 'sed -i "s/\r$//" /tmp/mira-prod-remote.sh && bash /tmp/mira-prod-remote.sh'

      - name: Public smoke
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' https://search.aerosuite.com.br/ || true)"
            echo "attempt=${attempt} public_http=${code}"
            [[ "$code" == "200" ]] && exit 0
            sleep 3
          done
          echo 'Public smoke failed'
          exit 1
