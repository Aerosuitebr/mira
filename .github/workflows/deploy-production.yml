name: Deploy Production

on:
  workflow_run:
    workflows: ["CI Quality Gate"]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Vultr (/opt/mira)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       (github.event.workflow_run.head_branch == 'master' ||
        github.event.workflow_run.head_branch == 'main'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve deploy SHA
        id: meta
        shell: bash
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "Deploying $SHA"

      - name: Setup SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ]; then
            echo "Secrets PROD_SSH_KEY, PROD_SSH_HOST e PROD_SSH_USER sao obrigatorios."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          cat > ~/.ssh/config <<EOF
          Host mira-prod
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ~/.ssh/prod_key
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
          EOF
          ssh mira-prod 'echo SSH_OK && hostname'

      - name: Pack release
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz -o /tmp/mira-release.tgz HEAD -- \
            backend/src/main/java \
            backend/src/main/resources \
            frontend/src \
            frontend/angular.json \
            frontend/nginx.conf \
            frontend/package.json \
            frontend/package-lock.json \
            services/outreach-bot \
            docker-compose.production.yml \
            docker-compose.tunnel.yml \
            docker-compose.yml \
            .env.production.example \
            scripts/deploy/nginx-mira.conf
          ls -lh /tmp/mira-release.tgz

      - name: Upload release to server
        shell: bash
        run: |
          set -euo pipefail
          scp /tmp/mira-release.tgz mira-prod:/tmp/mira-release.tgz
          printf '%s\n' '${{ steps.meta.outputs.sha }}' > /tmp/mira-release.sha
          scp /tmp/mira-release.sha mira-prod:/tmp/mira-release.sha

      - name: Extract and rebuild on server
        shell: bash
        run: |
          set -euo pipefail
          ssh mira-prod bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/mira
          SHA="$(tr -d '[:space:]' </tmp/mira-release.sha)"
          SHORT="${SHA:0:7}"
          echo "=== deploying ${SHORT} ==="

          mkdir -p /opt/mira-backups
          tar -czf "/opt/mira-backups/mira-pre-${SHORT}-$(date +%Y%m%d%H%M%S).tgz" \
            backend/src docker-compose.production.yml frontend/src scripts/deploy/nginx-mira.conf \
            2>/dev/null || true

          tar -xzf /tmp/mira-release.tgz -C /opt/mira

          docker compose -f docker-compose.yml -f docker-compose.production.yml build mira-api mira-frontend mira-outreach-bot
          docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --no-deps mira-api mira-frontend mira-outreach-bot

          # O nginx monta o arquivo de configuração. Recriar o proxy garante que
          # ele use o inode novo extraído pelo release, inclusive para o webhook.
          docker compose -f docker-compose.tunnel.yml up -d --force-recreate mira-tunnel-proxy
          webhook_code="000"
          for i in $(seq 1 15); do
            webhook_code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8083/webhooks/outreach-bot -H 'Content-Type: application/json' -d '{}' || true)"
            [ "$webhook_code" = "401" ] && break
            sleep 1
          done
          echo "outreach_webhook_http=$webhook_code"
          test "$webhook_code" = "401"

          if ! docker inspect mira-api --format '{{json .NetworkSettings.Networks}}' | grep -q aerosuite_default; then
            docker network connect aerosuite_default mira-api || true
          fi

          ready=0
          for i in $(seq 1 120); do
            api="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/actuator/health || true)"
            front="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4201/ || true)"
            if [ "$api" = "200" ] && [ "$front" = "200" ]; then
              echo "OK api+front after ${i}s"
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "Services not healthy"
            docker logs mira-api --tail 80 || true
            docker logs mira-frontend --tail 40 || true
            exit 1
          fi

          echo "$SHA" > /opt/mira/.deployed-commit
          docker exec mira-api printenv | grep -E 'APP_EVOLUTION_OUTBOUND|APP_OUTREACH_DISPATCH|APP_EVOLUTION_ENABLED|PUBLIC_BASE_URL' || true
          docker ps --filter name=mira --format '{{.Names}} {{.Status}}'
          echo "DEPLOYED ${SHORT}"
          REMOTE

      - name: Public smoke
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' https://search.aerosuite.com.br/ || true)"
          echo "public_http=$code"
          if [ "$code" != "200" ]; then
            echo "Aviso: homepage nao retornou 200 ($code)"
          fi
